services:
  postgres:
    image: postgres:16-alpine
    container_name: ynov_j3_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ynov_data_db
    ports:
      - "5432:5432"
    volumes:
      - j3_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ynov_data_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  metabase:
    image: metabase/metabase:latest
    container_name: ynov_j3_metabase
    restart: always
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ynov_data_db
      MB_DB_PORT: 5432
      MB_DB_USER: postgres
      MB_DB_PASS: postgres
      MB_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - j3_metabase_data:/metabase-data

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: ynov_j3_pgweb
    restart: always
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ynov_data_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  j3_pgdata:
  j3_metabase_data:
